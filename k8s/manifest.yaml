# Secret is NOT stored in git. Create it once:
#   kubectl -n berlin-stats create secret generic berlin-stats --from-literal=SECRET_PASSWORD='...'
#   kubectl -n berlin-stats create secret generic berlin-stats-db --from-literal=DATABASE_URL='postgresql://berlin_stats:PASSWORD@postgres.postgres.svc.cluster.local:5432/berlin_stats'
apiVersion: v1
kind: Namespace
metadata:
  name: berlin-stats
---
apiVersion: v1
kind: Service
metadata:
  name: berlin-stats
  namespace: berlin-stats
spec:
  selector:
    app: berlin-stats
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: berlin-stats
spec:
  stripPrefix:
    prefixes:
      - /berlin-stats
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: berlin-stats
  namespace: berlin-stats
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: berlin-stats-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /berlin-stats
            pathType: Prefix
            backend:
              service:
                name: berlin-stats
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: berlin-stats
  namespace: berlin-stats
spec:
  replicas: 3
  selector:
    matchLabels:
      app: berlin-stats
  template:
    metadata:
      labels:
        app: berlin-stats
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: berlin-stats
          image: ghcr.io/miklyx/berlin_stats:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ROOT_PATH
              value: /berlin-stats
            - name: POLL_INTERVAL_HOURS
              value: "24"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: berlin-stats-db
                  key: DATABASE_URL
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: berlin-stats
                  key: SECRET_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
